<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoring Results</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 560px;
            width: 100%;
            padding: 2rem;
        }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { color: #8b949e; margin-bottom: 2rem; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat {
            background: #0d1117;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .stat .number {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .stat .label {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 0.25rem;
        }
        .cat-a .number { color: #3fb950; }
        .cat-b .number { color: #58a6ff; }
        .cat-c .number { color: #d29922; }
        .cat-reject .number { color: #f85149; }
        .total .number { color: #fff; }
        a.download {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        a.download:hover { background: #2ea043; }
        a.back {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        a.back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scoring Complete</h1>
        <p class="subtitle">{{ total }} leads processed</p>

        <div class="card">
            <div class="stats">
                <div class="stat total">
                    <div class="number">{{ total }}</div>
                    <div class="label">Total Leads</div>
                </div>
                <div class="stat cat-a">
                    <div class="number">{{ cat_a }}</div>
                    <div class="label">Category A (8-10)</div>
                </div>
                <div class="stat cat-b">
                    <div class="number">{{ cat_b }}</div>
                    <div class="label">Category B (6-7)</div>
                </div>
                <div class="stat cat-c">
                    <div class="number">{{ cat_c }}</div>
                    <div class="label">Category C (4-5)</div>
                </div>
            </div>

            <div class="stat cat-reject" style="margin-bottom: 1.5rem;">
                <div class="number">{{ cat_reject }}</div>
                <div class="label">Rejected (1-3)</div>
            </div>

            <a href="/download/{{ job_id }}" class="download">Download Enriched CSV</a>
            <a href="/" class="back">Score another file</a>
        </div>
    </div>
</body>
</html>
